<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Dashboard — Dieseko Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#151519; --surface-2:#1C1C21; --raise:#232329;
  --line:#2A2A31; --line-soft:#212127;
  --text:#F3F3F1; --text-2:#B4B4BC; --muted:#7C7C87; --muted-2:#57575F;
  --pos:#5FB88F; --neg:#E05A54; --on-accent:#0E0E10;
  --track:#2A2A31; --shadow:0 16px 44px rgba(0,0,0,.55);
  --band:rgba(253,160,118,.16);
}
:root[data-theme="light"]{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#F7F7F5; --raise:#FFFFFF;
  --line:#E3E3DE; --line-soft:#EDEDE9;
  --text:#131316; --text-2:#4C4C55; --muted:#75757E; --muted-2:#A2A2AA;
  --pos:#2E7D5B; --neg:#D6453F; --on-accent:#131316;
  --track:#E8E8E4; --shadow:0 16px 44px rgba(20,20,25,.15);
  --band:rgba(253,160,118,.24);
}
:root{
  --coral:#FDA076; --coral-2:#F0997B; --teal:#26CBCA; --peri:#26CBCA;
  --leaf:#7FD4C6; --amber:#F0997B;
  --accent:#FDA076;
  --rail:252px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.mono{font-family:Inter,system-ui,sans-serif}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.shell{display:flex;min-height:100vh}

/* ================= RAIL ================= */
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.rail-top{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.agency{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.agency-mark{width:24px;height:24px;border-radius:5px;
  background:linear-gradient(135deg,var(--coral),var(--coral-2));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#0E0E10;letter-spacing:-.04em}
.agency-name{font-weight:700;font-size:13px;letter-spacing:-.01em}
.agency-name span{color:var(--muted);font-weight:400}
.theme-btn{margin-left:auto;width:28px;height:28px;border-radius:6px;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .12s,color .12s,border-color .12s}
.theme-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--muted-2)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.client-card{display:flex;align-items:center;gap:10px;padding:9px 11px;
  border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.client-avatar{width:26px;height:26px;border-radius:5px;flex:0 0 26px;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:11px;color:#0E0E10;letter-spacing:-.02em;background:var(--accent)}
.client-nm{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-tag{font-family:Inter,system-ui,sans-serif;font-size:9px;color:var(--muted);letter-spacing:.06em;display:block}
.rail-nav{flex:1;overflow-y:auto;padding:8px 0 16px}
.nav-group{font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--muted-2);padding:14px 16px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 16px;font-size:13px;color:var(--text-2);border-left:2px solid transparent;
  transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.is-active{background:var(--surface-2);border-left-color:var(--accent);color:var(--text);font-weight:600}
.nav-item.is-addon{color:var(--muted)}
.nav-item.is-addon .swatch{opacity:.55}
.nav-item.is-addon:hover{color:var(--text)}
.nav-item.is-addon.is-active{color:var(--text)}
.nav-item.is-addon.is-active .swatch{opacity:1}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.swatch{width:7px;height:7px;border-radius:2px;flex:0 0 7px;background:var(--muted-2)}
.nav-ico{flex:0 0 13px;margin-left:-3px;color:var(--muted)}
.nav-item.is-active .nav-ico{color:var(--accent)}
.rail-bottom{border-top:1px solid var(--line);padding:6px 0 8px;flex:0 0 auto}

/* ================= TOPBAR ================= */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 22px;
  min-height:56px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:40}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.template-flag{margin-left:auto;display:flex;align-items:center;gap:7px;
  font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--teal);border:1px solid rgba(38,203,202,.34);
  background:rgba(38,203,202,.08);padding:4px 10px;border-radius:4px}

/* ================= DATE PICKER ================= */
.dp{position:relative}
.dp-trigger{display:flex;align-items:center;gap:9px;padding:6px 11px 6px 7px;
  border:1px solid var(--line);border-radius:20px;background:var(--surface-2);
  transition:border-color .14s,background .14s}
.dp-trigger:hover{border-color:var(--muted-2);background:var(--raise)}
.dp-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dp-chip{font-size:11.5px;font-weight:600;letter-spacing:.01em;padding:2px 9px;border-radius:12px;
  background:var(--accent);color:var(--on-accent);white-space:nowrap}
.dp-range{font-size:13px;color:var(--text);white-space:nowrap}
.dp-cmp{font-family:Inter,system-ui,sans-serif;font-size:10px;color:var(--muted);white-space:nowrap}
.dp-caret{color:var(--muted);font-size:10px}

.dp-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:80;display:none;
  background:var(--raise);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;width:592px}
.dp-panel.open{display:flex}
.dp-left{width:248px;flex:0 0 248px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:8px 0}
.dp-preset{display:block;width:100%;text-align:left;padding:9px 18px;font-size:13px;
  color:var(--text-2);transition:background .1s,color .1s}
.dp-preset:hover{background:var(--surface-2);color:var(--text)}
.dp-preset.is-on{background:var(--band);color:var(--text);font-weight:600}
.dp-preset:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dp-cmpbox{margin-top:auto;border-top:1px solid var(--line);padding:12px 18px 6px;
  display:flex;flex-direction:column;gap:10px}
.dp-cmprow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.sw{width:36px;height:20px;border-radius:12px;background:var(--track);position:relative;
  transition:background .16s;flex:0 0 36px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:transform .16s,background .16s}
.sw.on{background:var(--band)}
.sw.on::after{transform:translateX(16px);background:var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dp-cmpsel{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface-2);font-size:12.5px}
.dp-cmpsel:disabled{opacity:.4}

.dp-right{flex:1;min-width:0;display:flex;flex-direction:column}
.dp-fields{display:flex;align-items:flex-end;gap:10px;padding:16px 18px 12px}
.dp-field{flex:1;min-width:0}
.dp-field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;
  font-family:Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.dp-field input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface-2);font-size:13px;color:var(--text)}
.dp-field input.active{border-color:var(--accent)}
.dp-dash{color:var(--muted);padding-bottom:9px}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 18px 6px;
  font-family:Inter,system-ui,sans-serif;font-size:10px;color:var(--muted);text-align:center}
.dp-months{overflow-y:auto;max-height:268px;padding:0 18px 8px}
.dp-mname{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{height:30px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:var(--text-2);border-radius:4px;position:relative;
  transition:background .1s,color .1s}
.dp-day:hover:not(.off){background:var(--surface-2);color:var(--text)}
.dp-day.mid{background:var(--band);border-radius:0;color:var(--text)}
.dp-day.edge{background:var(--accent);color:var(--on-accent);font-weight:700}
.dp-day.edge.s{border-radius:4px 0 0 4px}
.dp-day.edge.e{border-radius:0 4px 4px 0}
.dp-day.edge.s.e{border-radius:4px}
.dp-day.off{color:var(--muted-2);cursor:default;opacity:.45}
.dp-day.blank{cursor:default}
.dp-foot{border-top:1px solid var(--line);padding:10px 18px;display:flex;
  align-items:center;justify-content:flex-end;gap:6px}
.dp-txt{padding:7px 14px;border-radius:5px;font-size:13px;font-weight:600;color:var(--accent);
  transition:background .12s}
.dp-txt:hover{background:var(--band)}
.dp-txt.ghost{color:var(--muted)}
.dp-txt.ghost:hover{background:var(--surface-2);color:var(--text)}
.dp-txt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ================= PAGE ================= */
.page{padding:20px 22px 34px;flex:1}
.actionbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:14px}
.geosel{padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:var(--surface-2);
  font-size:12.5px;color:var(--text);max-width:214px}
.geosel:hover{border-color:var(--muted-2)}
.geosel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.lc-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:13px 14px 12px;position:relative;overflow:hidden}
.lc-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--lc-c)}
.lc-stage{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--lc-c)}
.lc-val{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:6px;font-variant-numeric:tabular-nums}
.lc-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.lc-foot{margin-top:8px}
tr.sect td{background:var(--surface-2);font-weight:700;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;padding-top:11px;padding-bottom:9px}
@media (max-width:1080px){.lc{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.lc{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:7px 13px;
  font-size:12.5px;border-radius:5px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--raise);border-color:var(--muted-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.07);background:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel-head{padding:12px 16px 11px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.panel-head h2{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0}
.panel-body{padding:15px 16px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid37{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.mb{margin-bottom:14px}

/* ================= KPI ================= */
.kpis{display:grid;gap:11px;margin-bottom:14px}
.kpis.k7{grid-template-columns:repeat(7,1fr)}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.mod-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.mod-row:last-child{border-bottom:0}
.mod-txt{flex:1;min-width:0}
.mod-n{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.mod-d{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:70ch}
.mod-need{font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.06em;
  color:var(--muted-2);margin-top:6px;text-transform:uppercase}
.mod-sw{margin-top:2px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 13px 11px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--kpi-c,var(--muted-2));opacity:.9}
.kpi-label{font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);min-height:24px}
.kpi-val{font-size:24px;font-feature-settings:"tnum" 1;font-weight:800;letter-spacing:-.035em;line-height:1.05;
  margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;min-height:18px}
.delta{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)} .delta.flat{color:var(--muted)}
.kpi-target{margin-top:9px}
.kpi-track{height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative}
.kpi-track span{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--kpi-c,var(--accent))}
.kpi-track i{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.85}
.kpi-tl{display:flex;justify-content:space-between;gap:8px;margin-top:5px;
  font-family:Inter,system-ui,sans-serif;font-size:9.5px;color:var(--muted)}
.pace-on{color:var(--pos)} .pace-off{color:var(--neg)}

/* ================= FLOW ================= */
.flow{width:100%;height:auto;display:block}
.flow-stage{font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.13em;fill:var(--muted)}
.flow-total{font-size:15px;font-weight:800;letter-spacing:-.03em;fill:var(--text)}
.flow-step{font-family:Inter,system-ui,sans-serif;font-size:9.5px;fill:var(--muted-2)}
.ribbon{transition:opacity .16s}
.flow.dim .ribbon{opacity:.14}
.flow.dim .ribbon.hot{opacity:.78}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line-soft)}
.lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:default}
.lg i{width:9px;height:9px;border-radius:2px;display:block}
.lg b{font-family:Inter,system-ui,sans-serif;font-weight:500;color:var(--muted);font-size:11px}

/* ================= FUNNEL ================= */
.fsteps{display:flex;flex-direction:column}
.fstep{display:grid;grid-template-columns:150px 1fr 110px;gap:14px;align-items:center;padding:9px 0}
.fstep-n{font-size:12.5px;font-weight:600}
.fstep-n em{display:block;font-style:normal;font-family:Inter,system-ui,sans-serif;
  font-size:9.5px;color:var(--muted);letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.fstep-bar{height:26px;border-radius:4px;background:var(--track);overflow:hidden;position:relative}
.fstep-bar span{position:absolute;inset:0 auto 0 0;border-radius:4px;opacity:.9}
.fstep-v{text-align:right;font-family:Inter,system-ui,sans-serif;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums}
.fdrop{display:grid;grid-template-columns:150px 1fr 110px;gap:14px}
.fdrop-in{grid-column:2;font-family:Inter,system-ui,sans-serif;font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:8px;padding-left:2px}
.fdrop-in b{font-weight:600;color:var(--text-2)}
.fdrop-in u{text-decoration:none;color:var(--neg)}

/* ================= TABLE ================= */
table.dt{width:100%;border-collapse:collapse}
table.dt th{font-family:Inter,system-ui,sans-serif;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;
  padding:0 9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt th:first-child{text-align:left;padding-left:0}
table.dt th:last-child{padding-right:0}
table.dt td{padding:8px 9px;border-bottom:1px solid var(--line-soft);text-align:right;
  font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--text-2)}
table.dt td:first-child{text-align:left;padding-left:0;color:var(--text);font-weight:500}
table.dt td:last-child{padding-right:0}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover td{background:var(--surface-2)}
.namecell{display:flex;align-items:center;gap:9px}
.namecell i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.minibar{width:52px;height:4px;border-radius:2px;background:var(--track);position:relative;
  overflow:hidden;flex:0 0 52px;display:inline-block;vertical-align:middle;margin-right:8px}
.minibar span{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent)}
.tag{font-family:Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.brand{color:var(--peri);border-color:rgba(38,203,202,.4);background:rgba(38,203,202,.09)}
.tag.gen{color:var(--teal);border-color:rgba(38,203,202,.4);background:rgba(38,203,202,.08)}
.up-s{color:var(--pos)} .down-s{color:var(--neg)}

.trend{width:100%;height:auto;display:block}
.tr-axis{font-family:Inter,system-ui,sans-serif;font-size:9px;fill:var(--muted-2)}

.bd{display:flex;flex-direction:column;gap:10px}
.bd-lab{font-size:12.5px;color:var(--text-2);margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}
.bd-lab em{font-style:normal;font-family:Inter,system-ui,sans-serif;font-size:11px;color:var(--muted)}
.bd-row{display:grid;grid-template-columns:1fr 58px;gap:11px;align-items:center}
.bd-track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bd-track span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bd-val{font-family:Inter,system-ui,sans-serif;font-size:12px;text-align:right;color:var(--text)}

.notes{display:flex;flex-direction:column}
.note{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.note:last-child{border-bottom:0}
.note-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 7px}
.note-dot.warn{background:var(--amber)} .note-dot.bad{background:var(--neg)} .note-dot.good{background:var(--pos)}
.note-t{font-size:12.5px;font-weight:600;line-height:1.35}
.note-d{font-size:12px;color:var(--muted);margin-top:3px}

.status{display:grid;grid-template-columns:repeat(3,1fr)}
.st{padding:11px 16px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  display:flex;gap:9px;align-items:flex-start}

function presetLabel(id){
  if(id==="custom") return "Custom";
  const p=PRESETS.find(x=>x.id===id);
  return p?p.l:"Aangepast";
}
function rangeFor(id){
  const t=new Date(TODAY); let f=new Date(TODAY), e=new Date(TODAY);
  const dow=(t.getDay()+6)%7; /* 0 = maandag */
  switch(id){
    case "today": break;
    case "yesterday": f.setDate(t.getDate()-1); e=new Date(f); break;
    case "thisweek": f.setDate(t.getDate()-dow); break;
    case "last7": f.setDate(t.getDate()-6); break;
    case "lastweek": e=new Date(t); e.setDate(t.getDate()-dow-1); f=new Date(e); f.setDate(e.getDate()-6); break;
    case "last28": f.setDate(t.getDate()-27); break;
    case "last30": f.setDate(t.getDate()-29); break;
    case "thismonth": f=new Date(t.getFullYear(),t.getMonth(),1); break;
    case "lastmonth": f=new Date(t.getFullYear(),t.getMonth()-1,1); e=new Date(t.getFullYear(),t.getMonth(),0); break;
    case "last90": f.setDate(t.getDate()-89); break;
    case "qtd": f=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1); break;
    case "ytd": f=new Date(t.getFullYear(),0,1); break;
    case "lastyear": f=new Date(t.getFullYear()-1,0,1); e=new Date(t.getFullYear()-1,11,31); break;
  }
  return [f,e];
}
function matchPreset(f,t){
  for(const p of PRESETS){
    const [a,b]=rangeFor(p.id);
    if(dnum(a)===dnum(f)&&dnum(b)===dnum(t)) return p.id;
  }

}

/* ---- donut voor verdelingen met weinig categorieën ---- */
function donut(items, colors, midSub){
  const total=items.reduce((a,i)=>a+i[1],0)||1;
  const R=62,r=40,cx=76,cy=76;
  let a0=-Math.PI/2, paths="";
  items.forEach((it,i)=>{
    const frac=it[1]/total, a1=a0+frac*Math.PI*2, big=frac>.5?1:0;
    const p=(rad,ang)=>[(cx+rad*Math.cos(ang)).toFixed(2),(cy+rad*Math.sin(ang)).toFixed(2)];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[xi1,yi1]=p(r,a1),[xi0,yi0]=p(r,a0);
    paths+=`<path d="M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${xi1},${yi1} A${r},${r} 0 ${big} 0 ${xi0},${yi0} Z" fill="${colors[i%colors.length]}"/>`;
    a0=a1;
  });
  const top=items.slice().sort((a,b)=>b[1]-a[1])[0];
  const svg=`<svg class="donut-svg" width="152" height="152" viewBox="0 0 152 152" role="img"
    aria-label="Verdeling per categorie">${paths}
    <text class="donut-mid" x="76" y="74" text-anchor="middle">${pct(top[1]/total*100)}</text>
    <text class="donut-midsub" x="76" y="89" text-anchor="middle">${esc((midSub||top[0]).toUpperCase())}</text></svg>`;
  const legend=items.map((it,i)=>`<div class="donut-row">

    <b>${pct(it[1]/total*100)}</b></div>`).join("");
  return `<div class="donut-wrap">${svg}<div class="donut-lg">${legend}</div></div>`;
}

/* ---- echte funnelvorm; breedte is logaritmisch geschaald ---- */
function funnelChart(steps, accent){
  accent="var(--dieseko-red)";
  const n=steps.length, vals=steps.map(s=>Math.max(s.v,1));
  const lmax=Math.log(Math.max(...vals)), lmin=Math.log(Math.min(...vals));
  const WMAX=330, WMIN=52;
  const w=v=>lmax===lmin?WMAX:WMIN+((Math.log(v)-lmin)/(lmax-lmin))*(WMAX-WMIN);
  const H=52, GAP=5, TOP=8, cx=356, LEFT=176, RIGHT=536;
  const height=TOP+n*H+(n-1)*GAP+8;
  let g=`<svg class="funnelsvg" viewBox="0 0 760 ${height}" role="img"
    aria-label="Funnel van ${esc(steps[0].n)} naar ${esc(steps[n-1].n)}">`;
  steps.forEach((s,i)=>{
    const yt=TOP+i*(H+GAP), yb=yt+H;
    const wt=w(vals[i]), wb=i<n-1?w(vals[i+1]):wt*.7;
    const op=(.34+(i/Math.max(n-1,1))*.66).toFixed(2);
    g+=`<polygon points="${cx-wt/2},${yt} ${cx+wt/2},${yt} ${cx+wb/2},${yb} ${cx-wb/2},${yb}"
      fill="${accent}" opacity="${op}"/>`;
    g+=`<text class="fn-name" x="${LEFT}" y="${yt+(s.s?23:30)}" text-anchor="end">${esc(s.n)}</text>`;
    if(s.s) g+=`<text class="fn-sub" x="${LEFT}" y="${yt+37}" text-anchor="end">${esc(s.s.toUpperCase())}</text>`;
    g+=`<text class="fn-val" x="${RIGHT+20}" y="${yt+(i<n-1?24:31)}">${fmt(s.v)}</text>`;
    if(i<n-1){
      const rr=steps[i+1].v/Math.max(s.v,.0001)*100;
      g+=`<text class="fn-drop" x="${RIGHT+20}" y="${yt+40}">${rr<10?rr.toFixed(2):rr.toFixed(1)}% through</text>`;
      g+=`<text class="fn-lost" x="${RIGHT+120}" y="${yt+40}">−${fmt(s.v-steps[i+1].v)}</text>`;
    }
  });
  return g+`</svg>`;
}

        L${x1},${b.y1} C${cx1},${b.y1} ${cx0},${a.y1} ${x0},${a.y1} Z" fill="${col}" opacity=".26"/>`;
    }
    g.forEach((gg,si)=>{svg+=`<rect class="ribbon" data-ch="${k}" x="${colX[si]}" y="${gg.y0}"
      width="${colW}" height="${Math.max(gg.y1-gg.y0,1.5)}" rx="2" fill="${col}" opacity=".95"/>`;});
  });

    <b>${(chData(k).cnv/(t.cnv||1)*100).toFixed(0)}%</b></span>`).join("");

/* ---- gedeelde tijdas: posities en maandgrenzen ---- */
function xOfDate(d,pad,W){
  const t0=S.from.getTime(), t1=S.to.getTime();
  const f=(t1===t0)?0:(d.getTime()-t0)/(t1-t0);
  return pad.l+f*(W-pad.l-pad.r);
}
function monthMarks(){
  const out=[]; let d=new Date(S.from.getFullYear(),S.from.getMonth(),1);
  if(d<S.from) d=new Date(S.from.getFullYear(),S.from.getMonth()+1,1);
  while(d<=S.to){ out.push(new Date(d)); d=new Date(d.getFullYear(),d.getMonth()+1,1); }
  return out;
}
/* Bij een korte periode zijn er geen maandgrenzen; val dan terug op weekmarkeringen. */
function timeTicks(){
  const ms=monthMarks().map(d=>({d,label:NLM[d.getMonth()]+(d.getMonth()===0?" "+d.getFullYear():""),major:true}));
  if(ms.length>=2) return ms;
  /* Korte periode: dagmarkeringen, maar een maandgrens blijft altijd zichtbaar. */
  const out=[]; const step=days()<=14?2:7;
  for(let i=0;i<days();i+=step){
    const d=new Date(S.from); d.setDate(S.from.getDate()+i);
    if(ms.some(m=>Math.abs(m.d-d)<2*86400000)) continue;
    out.push({d,label:dshort(d),major:false});
  }
  return out.concat(ms);
}
function axisSvg(pad,W,H){
  let g="";
  timeTicks().forEach(t=>{
    const x=xOfDate(t.d,pad,W);
    if(x<pad.l-1||x>W-pad.r+1) return;
    if(t.major) g+=`<line class="acq-mline" x1="${x.toFixed(1)}" y1="${pad.t}" x2="${x.toFixed(1)}" y2="${H-pad.b}"/>`;
    g+=`<text class="${t.major?"acq-mo":"acq-ax"}" x="${x.toFixed(1)}" y="${H-pad.b+15}"
      text-anchor="${t.major?"start":"middle"}">${t.label}</text>`;
  });
  return g;
}

/* ---- dagelijkse reeks per kanaal, opgeteld gelijk aan de periodetotalen ---- */
function dailySeries(metric){ return dailyFor(C().channels, k=>chData(k)[metric]); }
/* Zelfde dagverdeling voor elke set reeksen: kanaalgroepen of socialplatformen. */
function dailyFor(chs, totalOf){
  const n=days(), out=[];
  const base={}; chs.forEach(k=>base[k]=totalOf(k)/n);
  for(let i=0;i<n;i++){
    const d=new Date(S.from); d.setDate(S.from.getDate()+i);
    const dow=d.getDay();
    const week=(dow===0||dow===6)?.38:1.15;          /* B2B: weekend is stil */
    const row={d,v:{},tot:0};
    chs.forEach((k,ci)=>{
      const f=week*(1+wob(i*7+ci*31,.24))*(1+Math.sin(i/9+ci*1.7)*.09);
      row.v[k]=Math.max(base[k]*f,0);
    });
    out.push(row);
  }
  chs.forEach(k=>{
    const sum=out.reduce((a,r)=>a+r.v[k],0)||1, target=totalOf(k);
    out.forEach(r=>{r.v[k]=r.v[k]/sum*target;});
  });
  out.forEach(r=>r.tot=chs.reduce((a,k)=>a+r.v[k],0));
  return out;
}

const ACQ_METRICS={
  ses:  {label:"Sessions",    f:fmtK},
  usr:  {label:"Users",       f:fmtK},
  cnv:  {label:"Conversions", f:fmt },
  spend:{label:"Spend",       f:curK}
};
const ACQ_TOP=5;
/* Register per grafiek, zodat de hover de waarden kan terugvinden. */
const ACQ_CHARTS={};

/* GA4 toont in Verkeersacquisitie de primaire kanaalgroep: de vijf grootste reeksen
   plus een gestippelde totaallijn. Diezelfde opzet wordt hier aangehouden. */
function acqChart(id, metric, opt){
  opt=opt||{};
  /* opt.meta/opt.pool/opt.total maken dezelfde grafiek bruikbaar voor socialplatformen */
  const met=opt.met||ACQ_METRICS[metric];
  const META=opt.meta||CH;
  const pool=opt.pool||C().channels;
  const totalOf=opt.total||(k=>chData(k)[metric]);
  const rows=dailyFor(pool,totalOf);
  const all=pool.slice().sort((a,b)=>totalOf(b)-totalOf(a));
  const keys=all.slice(0,opt.top||ACQ_TOP);
  const hidden=S.acqHidden||{};
  const hid=k=>hidden[id+":"+k];
  const shown=keys.filter(k=>!hid(k));
  const showTotal=!hid("__total");

  const W=opt.W||1160, H=opt.H||300, pad={l:opt.l||54,r:14,t:14,b:38};
  const peak=Math.max(
    showTotal&&shown.length?Math.max(...rows.map(r=>shown.reduce((a,k)=>a+r.v[k],0))):0,
    ...shown.map(k=>Math.max(...rows.map(r=>r.v[k]))),0.0001);
  const max=peak*1.12;
  const Y=v=>H-pad.b-(v/max)*(H-pad.t-pad.b);
  const X=r=>xOfDate(r.d,pad,W);

  let g=`<svg class="acq" id="${id}" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(met.label)} per reeks over de gekozen periode">`;
  for(let i=0;i<=4;i++){
    const y=pad.t+(i/4)*(H-pad.t-pad.b), v=max*(1-i/4);
    g+=`<line class="acq-grid" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}"/>`;
    g+=`<text class="acq-ax" x="${pad.l-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${met.f(v)}</text>`;
  }
  g+=axisSvg(pad,W,H);

  if(showTotal&&shown.length){
    const pts=rows.map(r=>`${X(r).toFixed(1)},${Y(shown.reduce((a,k)=>a+r.v[k],0)).toFixed(1)}`);
    g+=`<path d="M${pts.join(" L")} L${X(rows[rows.length-1]).toFixed(1)},${H-pad.b} L${X(rows[0]).toFixed(1)},${H-pad.b} Z"
      fill="var(--dieseko-red,#DD1742)" opacity=".07"/>`;
    g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--dieseko-red,#DD1742)"
      stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"/>`;
  }
  shown.forEach(k=>{
    const pts=rows.map(r=>`${X(r).toFixed(1)},${Y(r.v[k]).toFixed(1)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${META[k].color}" stroke-width="1.8"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  /* hoverlaag: verticale lijn plus een stip per zichtbare reeks */
  g+=`<g class="acq-cross" style="display:none">
    <line class="acq-crossline" y1="${pad.t}" y2="${H-pad.b}"/>
    ${showTotal&&shown.length?`<circle class="acq-dot" data-dot="__total" r="3.4"
      fill="var(--surface)" stroke="var(--dieseko-red,#DD1742)" stroke-width="2"/>`:""}
    ${shown.map(k=>`<circle class="acq-dot" data-dot="${k}" r="3.4"
      fill="var(--surface)" stroke="${META[k].color}" stroke-width="2"/>`).join("")}
  </g>`;
  g+=`<rect class="acq-hit" x="${pad.l}" y="${pad.t}" width="${W-pad.l-pad.r}"
    height="${H-pad.t-pad.b}" fill="transparent"/>`;
  g+=`</svg>`;

  ACQ_CHARTS[id]={
    W,H,pad,
    xs:rows.map(r=>X(r)),
    dates:rows.map(r=>dlab(r.d)),
    keys:shown, showTotal,
    label:Object.fromEntries(shown.map(k=>[k,META[k].name])),
    color:Object.fromEntries(shown.map(k=>[k,META[k].color])),
    vals:Object.fromEntries(shown.map(k=>[k,rows.map(r=>r.v[k])])),
    ys:Object.fromEntries(shown.map(k=>[k,rows.map(r=>Y(r.v[k]))])),
    totVals:rows.map(r=>shown.reduce((a,k)=>a+r.v[k],0)),
    totYs:rows.map(r=>Y(shown.reduce((a,k)=>a+r.v[k],0))),
    fmt:met.f
  };

  const legend=`<div class="flow-legend">
    <span class="lg tog ${showTotal?"":"off"}" data-acq-ch="${id}:__total">
      <i style="background:var(--dieseko-red,#DD1742)"></i>Total</span>
    ${keys.map(k=>{
      const sum=rows.reduce((a,r)=>a+r.v[k],0);
      return `<span class="lg tog ${hid(k)?"off":""}" data-acq-ch="${id}:${k}">
        <i style="background:${META[k].color}"></i>${esc(META[k].name)}
        <b>${met.f(sum)}</b></span>`;}).join("")}</div>`;

  return `<div class="acq-wrap">${g}<div class="acq-tip" id="${id}-tip"></div></div>${legend}`;
}

function trend(seed,cA,cB,labA,labB){
  const W=560,H=196,pad={l:8,r:8,t:18,b:34};
  const n=Math.min(Math.max(days(),8),40),a=[],b=[],ds=[];
  for(let i=0;i<n;i++){
    a.push(50+i*(2.4*14/n)+wob(seed+i,11));
    b.push(38+i*(3.1*14/n)+wob(seed+i+50,14));
    const d=new Date(S.from); d.setDate(S.from.getDate()+Math.round(i*(days()-1)/(n-1))); ds.push(d);
  }
  const maxA=Math.max(...a),maxB=Math.max(...b);
  const X=i=>xOfDate(ds[i],pad,W);
  const YA=v=>H-pad.b-(v/maxA)*(H-pad.t-pad.b);
  const YB=v=>H-pad.b-(v/maxB)*(H-pad.t-pad.b);
  let g=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(labA)} en ${esc(labB)}">`;
  for(let i=0;i<=3;i++){const y=pad.t+(i/3)*(H-pad.t-pad.b);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--line-soft)" stroke-width="1"/>`;}
  g+=axisSvg(pad,W,H);
  g+=`<path d="M${b.map((v,i)=>`${X(i)},${YB(v)}`).join(" L")} L${X(n-1)},${H-pad.b} L${X(0)},${H-pad.b} Z" fill="${cB}" opacity=".10"/>`;
  g+=`<polyline points="${b.map((v,i)=>X(i)+","+YB(v)).join(" ")}" fill="none" stroke="${cB}" stroke-width="1.6" stroke-linejoin="round"/>`;
  g+=`<polyline points="${a.map((v,i)=>X(i)+","+YA(v)).join(" ")}" fill="none" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<circle cx="${X(n-1)}" cy="${YA(a[n-1])}" r="3.2" fill="${cA}"/>`;
  g+=`</svg>
  <div class="flow-legend" style="margin-top:8px;padding-top:8px">
    <span class="lg"><i style="background:${cA}"></i>${esc(labA)}</span>
    <span class="lg"><i style="background:${cB}"></i>${esc(labB)}</span></div>`;
  return g;
}

function pagePlatform(k){
  const c=C(),x=chData(k),t=totals(),d=D(),m=CH[k],tg=T();
  const paid=m.type==="paid",ecom=c.goal==="ecom";
  const ctr=x.imp?x.clk/x.imp*100:null,cpc=x.clk&&x.spend?x.spend/x.clk:null;
  const cpa=x.spend?x.spend/Math.max(x.cnv,1):null,cr=x.cnv/Math.max(x.ses,1)*100;
  const roas=x.spend?x.rev/x.spend:null;
  /* Bij een lege selectie zijn ratio's onbepaald: toon een streepje in plaats van een fout. */
  const nz=(v,f)=>(v===null||v===undefined||!isFinite(v))?"—":f(v);
  let kpis;
  if(paid){
    kpis=[
      {l:"Impressions",v:fmtK(x.imp),d:d.ses*1.2,g:true,c:m.color},
      {l:"Clicks",v:fmtK(x.clk),d:d.ses,g:true,c:m.color},
      {l:"CTR",v:nz(ctr,pct),d:d.cr,g:true,c:"#26CBCA"},
      {l:"Cost per click",v:nz(cpc,cur),d:d.cpa*.5,g:false,c:"#F0997B"},
      {l:ecom?"Transactions":"Leads",v:fmt(x.cnv),d:d.cnv,g:true,c:c.accent},
      {l:ecom?"ROAS":"Cost per lead",v:ecom?nz(roas,x1):nz(cpa,cur),d:ecom?d.roas:d.cpa,g:ecom,
       c:ecom?"#7FD4C6":"#E05A54",raw:(ecom?roas:cpa)||0,target:ecom?tg.roas:tg.cpl,
       targetLabel:ecom?x1(tg.roas):cur(tg.cpl),lowerBetter:!ecom}
    ];
    if(S.poas) kpis.push({l:"POAS",v:poasOf(k)!==null?x1(poasOf(k)):"—",d:d.roas*.7,g:true,c:"#E8837E",
      raw:poasOf(k)||0,target:tg.poas,targetLabel:x1(tg.poas)});
  } else if(m.type==="organic"){
    kpis=[
      {l:"Impressions",v:fmtK(x.imp),d:d.ses*1.1,g:true,c:m.color},
      {l:"Clicks",v:fmtK(x.clk),d:d.ses,g:true,c:m.color},
      {l:"CTR",v:nz(ctr,pct),d:d.cr,g:true,c:"#26CBCA"},
      {l:"Avg. position",v:(c.queries.reduce((a,q)=>a+q[3],0)/c.queries.length).toFixed(1),d:-d.cr,g:false,c:"#26CBCA"},
      {l:"Users",v:fmtK(x.usr),d:d.ses*.9,g:true,c:"#5FB8D9"},
      {l:"Engagement rate",v:pct(engRate(x)*100),d:d.cr*.6,g:true,c:"#7FD4C6"},
      {l:ecom?"Transactions":"Leads",v:fmt(x.cnv),d:d.cnv,g:true,c:c.accent}
    ];
  } else if(m.type==="email"){
    kpis=[
      {l:"Sent",v:fmtK(x.imp),d:d.ses*.4,g:true,c:m.color},
      {l:"Clicks",v:fmtK(x.clk),d:d.ses,g:true,c:m.color},
      {l:"Click rate",v:pct(x.clk/Math.max(x.imp,1)*100),d:d.cr,g:true,c:"#26CBCA"},
      {l:"Sessions",v:fmtK(x.ses),d:d.ses,g:true,c:"#26CBCA"},
      {l:ecom?"Transactions":"Leads",v:fmt(x.cnv),d:d.cnv,g:true,c:c.accent}
    ];
  } else {
    kpis=[
      {l:"Users",v:fmtK(x.usr),d:d.ses*.9,g:true,c:m.color},
      {l:"Sessions",v:fmtK(x.ses),d:d.ses,g:true,c:"#5FB8D9"},
      {l:"Engagement rate",v:pct(engRate(x)*100),d:d.cr*.6,g:true,c:"#7FD4C6"},
      {l:"Conversion rate",v:pct(cr),d:d.cr,g:true,c:"#26CBCA"},

    <section class="panel"><div class="panel-head"><h2>Trend over time</h2><span class="eyebrow">Daily</span></div>

function pageTargets(){
  const c=C(),t=withAllGeo(()=>totals()),tg=withAllGeo(()=>T()),ecom=c.goal==="ecom";
  const cpl=t.spend/Math.max(t.cnv,1),roas=t.spend?t.rev/t.spend:0,cr=t.cnv/Math.max(t.ses,1)*100;
  const L=c.lead||{},mql=t.cnv*(L.mqlRate||0),sql=mql*(L.sqlRate||0),deal=sql*(L.dealRate||0);
  const defs=ecom?[
    {k:"ses",l:"Sessions",cur:t.ses,per:true,f:fmtK},
    {k:"cnv",l:"Transactions",cur:t.cnv,per:true,f:fmt},
    {k:"rev",l:"Revenue",cur:t.rev,per:true,f:curK},
    {k:"spend",l:"Ad spend",cur:t.spend,per:true,f:curK,lower:true},
    {k:"roas",l:"ROAS",cur:roas,per:false,f:x1},
    {k:"cr",l:"Conversion rate (%)",cur:cr,per:false,f:pct}
  ].concat(S.poas?[{k:"poas",l:"POAS",cur:poasTotal(),per:false,f:x1}]:[]):[
    {k:"ses",l:"Sessions",cur:t.ses,per:true,f:fmtK},
    {k:"cnv",l:"Leads",cur:t.cnv,per:true,f:fmt},
    {k:"mql",l:"MQL",cur:mql,per:true,f:fmt},
    {k:"sql",l:"SQL",cur:sql,per:true,f:fmt},
    {k:"deal",l:"Customers",cur:deal,per:true,f:fmt},
    {k:"spend",l:"Media spend",cur:t.spend,per:true,f:curK,lower:true},
    {k:"cpl",l:"Cost per lead",cur:cpl,per:false,f:cur,lower:true},
    {k:"cr",l:"Conversion rate (%)",cur:cr,per:false,f:pct}
  ].concat(S.poas?[{k:"poas",l:"POAS",cur:poasTotal(),per:false,f:x1}]:[]);
  const rows=defs.map(dd=>{
    const target=tg[dd.k]||0, expected=dd.per?target*mult():target;
    const done=dd.lower?(expected/Math.max(dd.cur,.0001)):(dd.cur/Math.max(expected,.0001));
    const p=Math.min(done*100,140);
    const cls=done>=1?"on":done>=.9?"near":"off", lbl=done>=1?"met":done>=.9?"close":"behind";
    return `<tr><td>${dd.l}</td>
      <td><input class="tin" type="number" step="any" value="${target}" data-t="${dd.k}" aria-label="Target for ${dd.l}"></td>
      <td>${dd.per?"per month":"average"}</td><td>${dd.f(expected)}</td><td>${dd.f(dd.cur)}</td>
      <td><div class="prog"><span style="width:${Math.min(p,100).toFixed(0)}%;background:${
        done>=1?"var(--pos)":done>=.9?"var(--amber)":"var(--neg)"}"></span><i style="left:100%"></i></div></td>
      <td><span class="pill ${cls}">${(done*100).toFixed(0)}% · ${lbl}</span></td></tr>`;
  }).join("");
  return `
  <div class="actionbar"><button class="btn" id="resetT">Reset to defaults</button>
    <button class="btn btn-primary">Save targets</button></div>
  <section class="panel mb"><div class="panel-head"><h2>Targets for ${esc(c.name)}</h2>
    <span class="eyebrow">Goal type: ${ecom?"e-commerce":"lead generation"}</span></div>
    <div class="panel-body"><table class="dt">
      <thead><tr><th>Metric</th><th>Target</th><th>Target basis</th><th>Expected this period</th>
      <th>Actual</th><th>Progress</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>
  <div class="grid2">
    <section class="panel"><div class="panel-head"><h2>How pacing is calculated</h2><span class="eyebrow">Pacing</span></div>
      <div class="panel-body" style="color:var(--text-2);font-size:13px">
        <p style="margin-top:0">Volume targets such as sessions, leads and revenue are monthly targets.
        For ${days()} days the dashboard uses ${(mult()*100).toFixed(0)}% of the monthly target.</p>
        <p>Ratio targets such as ROAS, conversion rate and cost per lead are not converted.</p>
        <p>For cost targets lower is better, so staying under target counts as met.</p>
        <p style="margin-bottom:0">This page always shows all countries together, regardless of the filter
        at the top. On the other pages targets do scale with the selected region.</p></div></section>
    <section class="panel"><div class="panel-head"><h2>Where targets appear</h2><span class="eyebrow">In the dashboard</span></div>
      <div class="panel-body" style="color:var(--text-2);font-size:13px">
        <p style="margin-top:0">Every KPI tile with a target gets a progress bar with a marker at one hundred per cent.</p>
        <p>Without a target a tile only shows the change against the comparison period. That tells you whether
        things are improving, not whether they are good enough.</p>
        <p style="margin-bottom:0">In production, targets are stored with the client and can be edited there.</p></div></section>
  </div>`;
}

function pageLifecycle(){
  const c=C(),t=totals(),d=D(),L=c.lead,g=geoF();
  const macro=t.cnv*MACRO_SHARE, crm=t.cnv*CRM_SHARE;
  const cv=n=>t.cnv*(CONVERSIONS.find(x=>x[0]===n)||[0,0])[1];
  const seo=chData("seo"), sea=chData("google");
  const man=(c.managed||c.channels);
  const onbetaald=c.channels.filter(k=>!man.includes(k))
    .reduce((a,k)=>a+chData(k).ses,0);
  const avgPos=c.queries.reduce((a,q)=>a+q[3],0)/c.queries.length;
  const engaged=t.engSes;
  const returning=t.ses*.39;

  /* delta-sleutel per metric, zodat vorige periode en vorig jaar afgeleid worden */
  const dp=c.deltas.prev, dy=c.deltas.yoy;
  const back=(v,key,set)=>v/(1+(set[key]||0)/100);

  const STAGES=[
    {k:"Awareness",  col:"#5FB8D9", head:fmtK(t.imp), sub:"impressions", dk:"ses",
     rows:[["Total impressions",t.imp,fmtK,"ses"],
           ["Impressions organic",seo.imp,fmtK,"ses"],
           ["Impressions paid",sea.imp,fmtK,"ses"],
           ["Average position organic",avgPos,v=>v.toFixed(1),"cr"]]},
    {k:"Acquisition",col:"#26CBCA", head:fmtK(t.ses), sub:"sessions", dk:"ses",
     rows:[["Sessions",t.ses,fmtK,"ses"],
           ["Clicks",t.clk,fmtK,"ses"],
           ["New visitors",t.ses*.61,fmtK,"ses"],
           ["Sessions outside SEA and SEO",onbetaald,fmtK,"ses"],
           ["Cost per click",sea.spend/Math.max(sea.clk,1),cur,"cpa"]]},
    {k:"Engagement", col:"#7FD4C6", head:pct(engaged/Math.max(t.ses,1)*100), sub:"engaged sessions", dk:"cr",
     rows:[["Engaged sessions",engaged,fmtK,"ses"],
           ["Engagement rate",engaged/Math.max(t.ses,1)*100,pct,"cr"],
           ["Data sheet downloads",cv("Data sheet download"),fmt,"cnv"],
           ["Average engagement time per session",t.engTime/Math.max(t.ses,1),dur,"cr"],
           ["Pages per session",3.4,v=>v.toFixed(1),"cr"]]},
    {k:"Conversion", col:"#DD1742", head:fmt(macro), sub:"enquiries", dk:"cnv",
     rows:[["Total conversions",t.cnv,fmt,"cnv"],
           ["Enquiries (macro)",macro,fmt,"cnv"],
           ["Logged in CRM",crm,fmt,"cnv"],
           ["Conversion rate",t.cnv/Math.max(t.ses,1)*100,pct,"cr"],
           ["Cost per enquiry",t.spend/Math.max(macro,1),cur,"cpa"]]},
    {k:"Retention",  col:"#F0997B", head:fmt(returning), sub:"returning visitors", dk:"ses",
     rows:[["Returning visitors",returning,fmtK,"ses"],
           ["Repeat enquiries",crm*.22,fmt,"cnv"],
           ["Parts & service enquiries",macro*.24,fmt,"cnv"],
           ["Newsletter signups",cv("Newsletter signup"),fmt,"cnv"]]}
  ];

  const cards=STAGES.map(st=>`
    <div class="lc-card" style="--lc-c:${st.col}">
      <div class="lc-stage">${st.k}</div>
      <div class="lc-val">${st.head}</div>
      <div class="lc-sub">${st.sub}</div>

    </div>`).join("");

  const body=STAGES.map(st=>`
    <tr class="sect"><td colspan="5" style="color:${st.col}">${st.k}</td></tr>
    ${st.rows.map(r=>{
      const [n,v,f,key]=r;
      return `<tr><td style="padding-left:14px">${esc(n)}</td>
        <td>${f(v)}</td>
        <td>${f(back(v,key,dp))}</td>
        <td>${f(back(v,key,dy))}</td>
        <td>${delta(S.bench==="prev"?dp[key]:dy[key],true)}</td></tr>`;}).join("")}`).join("");

  return `
  <div class="actionbar"><button class="btn btn-primary">Export PDF</button></div>
  <div class="lc">${cards}</div>
  <section class="panel mb"><div class="panel-head"><h2>Customer lifecycle</h2>

      <thead><tr><th>Metric</th><th>This period</th><th>Previous period</th>
      <th>Last year</th><th>Change</th></tr></thead>
      <tbody>${body}</tbody></table>
      <p style="color:var(--muted);font-size:12.5px;margin:14px 0 0">
      The Change column follows the comparison selected at the top.
      Awareness and Acquisition come from SEA and SEO, Conversion from GA4 and Retention from on-site
      behaviour. Once the CRM is connected, Retention can be extended with repeat orders per account.</p></div></section>
  <div class="grid2">
    <section class="panel"><div class="panel-head"><h2>Reach versus traffic</h2><span class="eyebrow">Over the period</span></div>
      <div class="panel-body">${trend(53,"#5FB8D9","#26CBCA","Impressions","Sessions")}</div></section>
    <section class="panel"><div class="panel-head"><h2>Enquiries versus spend</h2><span class="eyebrow">Over the period</span></div>

}

function buildPresets(){
  const el=document.getElementById("dpPresets");
  el.innerHTML=[{id:"custom",l:"Custom"}].concat(PRESETS)
    .map(p=>`<button class="dp-preset" data-p="${p.id}">${p.l}</button>`).join("");
  el.querySelectorAll(".dp-preset").forEach(b=>{
    b.addEventListener("click",()=>{
      const id=b.dataset.p;
      if(id==="custom"){DRAFT.preset="custom";DRAFT.anchor=null;paintPicker();return;}
      const [f,t]=rangeFor(id);
      DRAFT.from=f;DRAFT.to=t;DRAFT.preset=id;DRAFT.anchor=null;
      paintPicker();
    });
  });
}

function buildMonths(){
  const el=document.getElementById("dpMonths");
  let h="", cur=new Date(MIN_DATE.getFullYear(),MIN_DATE.getMonth(),1);
  const last=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(cur<=last){
    const y=cur.getFullYear(),m=cur.getMonth();
    h+=`<div class="dp-mname" data-m="${y}-${m}">${NLMF[m]} ${y}</div><div class="dp-grid">`;
    const first=new Date(y,m,1), lead=(first.getDay()+6)%7;
    for(let i=0;i<lead;i++) h+=`<div class="dp-day blank"></div>`;
    const dim=new Date(y,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const dt=new Date(y,m,d), future=dnum(dt)>dnum(TODAY);
      h+=`<button class="dp-day${future?" off":""}" ${future?"disabled":""}
        data-d="${y}-${m}-${d}">${d}</button>`;
    }
    h+=`</div>`;
    cur=new Date(y,m+1,1);
  }
  el.innerHTML=h;
  el.querySelectorAll(".dp-day[data-d]").forEach(b=>{
    b.addEventListener("click",()=>{
      const [y,m,d]=b.dataset.d.split("-").map(Number);
      const dt=new Date(y,m,d);
      if(DRAFT.anchor===null){ DRAFT.anchor=dt; DRAFT.from=dt; DRAFT.to=dt; }
      else {
        if(dnum(dt)<dnum(DRAFT.anchor)){DRAFT.from=dt;DRAFT.to=DRAFT.anchor;}
        else {DRAFT.from=DRAFT.anchor;DRAFT.to=dt;}
        DRAFT.anchor=null;
      }
      DRAFT.preset=matchPreset(DRAFT.from,DRAFT.to);
      paintPicker();
    });
  });
}

function paintPicker(){
  document.getElementById("dpF").value=dlab(DRAFT.from);
  document.getElementById("dpT").value=dlab(DRAFT.to);
  document.getElementById("dpF").classList.toggle("active",DRAFT.anchor!==null);
  document.getElementById("dpT").classList.toggle("active",DRAFT.anchor===null);
  document.querySelectorAll(".dp-preset").forEach(b=>
    b.classList.toggle("is-on",b.dataset.p===DRAFT.preset));
  const a=dnum(DRAFT.from), z=dnum(DRAFT.to);
  document.querySelectorAll(".dp-day[data-d]").forEach(b=>{
    const [y,m,d]=b.dataset.d.split("-").map(Number);
    const n=dnum(new Date(y,m,d));
    b.classList.remove("mid","edge","s","e");
    if(n===a||n===z){b.classList.add("edge"); if(n===a)b.classList.add("s"); if(n===z)b.classList.add("e");}
    else if(n>a&&n<z) b.classList.add("mid");
  });
}

function scrollToDraft(){

function wireFlow(){
  const svg=document.getElementById("flowSvg"),lg=document.getElementById("flowLegend");
  if(!svg||!lg)return;
  const on=k=>{svg.classList.add("dim");
    svg.querySelectorAll(".ribbon").forEach(r=>r.classList.toggle("hot",r.dataset.ch===k));};
  const off=()=>{svg.classList.remove("dim");
    svg.querySelectorAll(".ribbon").forEach(r=>r.classList.remove("hot"));};
  svg.querySelectorAll(".ribbon").forEach(r=>{
    r.addEventListener("mouseenter",()=>on(r.dataset.ch));
    r.addEventListener("mouseleave",off);});
  lg.querySelectorAll(".lg").forEach(l=>{
    l.addEventListener("mouseenter",()=>on(l.dataset.ch));
    l.addEventListener("mouseleave",off);});
}
function wireTargets(){
  document.querySelectorAll("input[data-t]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const v=parseFloat(inp.value); if(isNaN(v)||v<0)return;
      TARGET_EDITS[S.client]=TARGET_EDITS[S.client]||{};
      TARGET_EDITS[S.client][inp.dataset.t]=v; render();
    });
  });
  const r=document.getElementById("resetT");
  if(r) r.addEventListener("click",()=>{delete TARGET_EDITS[S.client];render();});
  document.querySelectorAll("[data-geo-level]").forEach(b=>
    b.addEventListener("click",()=>{S.geoLevel=b.dataset.geoLevel;render();}));
  document.querySelectorAll("[data-geo-drill]").forEach(b=>
    b.addEventListener("click",()=>{
      const key=b.dataset.geoDrill;
      S.geoSel={};
      setCon(key.slice(4),true);
      S.acqHidden={}; paintGeo(); render();}));
  document.querySelectorAll("[data-acq-traffic]").forEach(b=>
    b.addEventListener("click",()=>{S.acqTraffic=b.dataset.acqTraffic;render();}));
  document.querySelectorAll("[data-acq-ch]").forEach(b=>
    b.addEventListener("click",()=>{const k=b.dataset.acqCh;
      S.acqHidden[k]=!S.acqHidden[k]; render();}));
  const sp=document.getElementById("swPoas");
  if(sp) sp.addEventListener("click",()=>{S.poas=!S.poas;render();});
  const stm=document.getElementById("swTheme");
  if(stm) stm.addEventListener("click",()=>{S.theme=S.theme==="dark"?"light":"dark";applyTheme();render();});
  document.querySelectorAll(".mod-row .sw:not(#swPoas):not(#swTheme)").forEach(b=>
    b.addEventListener("click",()=>{const on=!b.classList.contains("on");
      b.classList.toggle("on",on); b.setAttribute("aria-checked",String(on));}));
}
/* GA4-achtige hover: verticale lijn, stip per reeks en een tooltip met alle waarden. */
function wireAcqHover(){
  Object.keys(ACQ_CHARTS).forEach(id=>{
    const svg=document.getElementById(id); if(!svg) return;
    const cfg=ACQ_CHARTS[id];
    const tip=document.getElementById(id+"-tip");
    const cross=svg.querySelector(".acq-cross");
    const hit=svg.querySelector(".acq-hit");
    if(!tip||!cross||!hit||!cfg.xs.length) return;
    const line=cross.querySelector(".acq-crossline");

    const move=e=>{
      const r=svg.getBoundingClientRect();
      const vx=(e.clientX-r.left)/r.width*cfg.W;
      let bi=0,bd=Infinity;
      cfg.xs.forEach((x,i)=>{const d=Math.abs(x-vx); if(d<bd){bd=d;bi=i;}});
      const px=cfg.xs[bi];
      cross.style.display="";
      line.setAttribute("x1",px); line.setAttribute("x2",px);
      cross.querySelectorAll(".acq-dot").forEach(c=>{
        const k=c.dataset.dot;
        const y=k==="__total"?cfg.totYs[bi]:cfg.ys[k][bi];
        c.setAttribute("cx",px); c.setAttribute("cy",y);
      });
      const rows=cfg.keys.map(k=>`<div class="acq-tip-r">
        <i style="background:${cfg.color[k]}"></i><span>${cfg.label[k]}</span>
        <b>${cfg.fmt(cfg.vals[k][bi])}</b></div>`).join("");
      const tot=cfg.showTotal?`<div class="acq-tip-r tot">
        <i style="background:var(--dieseko-red,#DD1742)"></i><span>Total</span>
        <b>${cfg.fmt(cfg.totVals[bi])}</b></div>`:"";
      tip.innerHTML=`<div class="acq-tip-d">${cfg.dates[bi]}</div>${rows}${tot}`;
      tip.classList.add("on");
      const left=px/cfg.W*r.width;
      const w=tip.offsetWidth||180;
      tip.style.left=Math.max(4,Math.min(left+14,r.width-w-4))+"px";
    };
    const leave=()=>{cross.style.display="none";tip.classList.remove("on");};
    svg.addEventListener("mousemove",move);
    svg.addEventListener("mouseleave",leave);
  });
}

function render(){
  const el=document.getElementById("page"),p=S.page;
  Object.keys(ACQ_CHARTS).forEach(k=>delete ACQ_CHARTS[k]);
  el.innerHTML = p==="overview"?pageOverview()
    : p==="lifecycle"?pageLifecycle()
    : (p==="website"||p==="webshop")?pageWebsite()
    : p==="ch:social"?pageSocial()
    : p.startsWith("ch:")?pagePlatform(p.slice(3))
    : p==="targets"?pageTargets()
    : p==="settings"?pageSettings()
    : pageHealth();
  document.querySelectorAll("#nav .nav-item, #navBottom .nav-item")
    .forEach(b=>b.classList.toggle("is-active",b.dataset.page===p));
  const title = p.startsWith("ch:") ? (CH[p.slice(3)].nav||CH[p.slice(3)].name) : (PAGE_TITLES[p]||"");
  document.getElementById("crumb").innerHTML=`${esc(C().name)} <span style="opacity:.5">/</span> <b>${esc(title)}</b>`;
  paintTrigger(); wireFlow(); wireTargets(); wireAcqHover();
}

document.getElementById("themeBtn").addEventListener("click",()=>{
  S.theme=S.theme==="dark"?"light":"dark"; applyTheme();
});
document.getElementById("dpTrigger").addEventListener("click",e=>{
  e.stopPropagation();
  document.getElementById("dpPanel").classList.contains("open") ? closePicker() : openPicker();
});
document.getElementById("dpPanel").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",closePicker);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePicker();});

document.getElementById("dpSwitch").addEventListener("click",function(){
  const on=!this.classList.contains("on");
  this.classList.toggle("on",on);
  this.setAttribute("aria-checked",String(on));
  document.getElementById("dpCmpSel").disabled=!on;
});
document.getElementById("dpCancel").addEventListener("click",closePicker);
document.getElementById("dpApply").addEventListener("click",()=>{
  S.from=DRAFT.from; S.to=DRAFT.to; S.preset=DRAFT.preset;
  S.compare=document.getElementById("dpSwitch").classList.contains("on");
  S.bench=document.getElementById("dpCmpSel").value;
  closePicker(); render();
});

/* boot */
[S.from,S.to]=rangeFor("last30");
selRegs(); applyTheme(); applyClient(); buildNav(); buildGeo(); buildPresets(); buildMonths(); render();
</script>
